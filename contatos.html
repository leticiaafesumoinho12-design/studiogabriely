<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Gabriella Rocha</title>
    <link rel="stylesheet" href="../css/contatos-style.css">
    <link rel="shortcut icon" href="../img/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/nav.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <img src="../img/logo.png" alt="Logo Gabriella Rocha" class="logo">

            <nav class="navbar">
                <ul class="menu">
                    <li><a href="../index.html">Início</a></li>
                    <li><a href="sobre.html">Sobre</a></li>
                    <li><a href="servico.html">Serviços</a></li>
                    <li><a href="contatos.html">Contato</a></li>
                    <li><a href="cursosv1.html">Cursos</a></li>
                </ul>
            </nav>

            <div class="search-container">
                <input type="text" placeholder="Pesquisar..." />
                <button type="submit">
                    <i class="fa fa-search"></i>
                </button>
            </div>
        </div>
    </header>
    <main>
        <aside class="menu-lateral">
            <img class="imagem-gabriely"   src="../img/imagem-gabriely.PNG" alt="imagem-gabriely">

            <h2>Redes</h2>
            <a href="https://www.instagram.com/gabrielyrochabeauty/" target="_blank" class="link instagram">Instagram</a>
            <a href="https://wa.me/5511997326767" target="_blank" class="link whatsapp">WhatsApp</a>
        </aside>

        <div class="fale-conosco">
            <h1>Contato rápido</h1>
            <p>Entre em contato para agendar seu atendimento ou para fazer sua inscrição.
        </div>


        <form class="formulario">

            <div class="form-group"> <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="form-group">
                <label for="nome">E-mail</label>
                <input type="text" id="email" name="email" placeholder="Digite seu E-mail" required>
            </div>


            <div class="form-group">
                <label for="number">Telefone</label>
                <input type="tel" name="telefone" pattern="(\([0-9]{2}\))\s([0-9]{4,5})-([0-9]{4})"
                    placeholder="(99) 99999-9999" title="Use o formato (99) 99999-9999" required>

            </div>
            <div class="form-group"> <label for="nome">Assunto</label>
                <input type="text" id="nome" name="nome" placeholder="O que busca?" required>
            </div>

            <button class="botao-enviar" type="submit">Enviar</button>


        </form>

    </main>





</body>

</html>
